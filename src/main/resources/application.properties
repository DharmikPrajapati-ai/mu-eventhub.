spring.application.name=mu-eventhub
server.port=8080

# File-based H2 database (data survives restarts, stored in ./data)
spring.datasource.url=jdbc:h2:file:./data/eventhub;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false

# Code a new college representative must enter on the sign-up page.
# Change this before sharing the site with real colleges.
app.invite-code=MU2026
